# SmolVLA defaults for robocasa/composite/ArrangeBreadBasket.
train:
  dataset_root: data/robocasa/composite/ArrangeBreadBasket
  dataset_repo_id: robocasa/composite/ArrangeBreadBasket
  output_root: outputs/train/robocasa/composite/ArrangeBreadBasket/smolvla
  resume: false
  job_name: smolvla
  wandb_project: robocasa-composite-arrangebreadbasket
  wandb_mode: online
  device: cuda
  use_amp: true
  amp_dtype: auto
  distributed:
    enabled: false
    launcher: accelerate
    num_processes: 1
    gpu_ids: all
    num_machines: 1
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
  steps: 50000
  batch_size: 8
  num_workers: 24
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  video_backend: torchcodec
  torch_sharing_strategy: file_system
  torchcodec_decoder_cache_size: 32
  seed: 42
  log_freq: 2000
  save_freq: 10000
  eval_freq: -1
  test_ratio: 0.2
  split_seed: 42
  split_shuffle: true
  chunk_size: 50
  n_action_steps: 50
  enable_wandb: true
  wandb_console: 'off'
  wandb_service_wait: 10
  policy_path: lerobot/smolvla_base
  n_obs_steps: 1
  max_state_dim: 32
  max_action_dim: 32
  resize_imgs_with_padding:
  - 512
  - 512
  empty_cameras: 0
  tokenizer_max_length: 48
  num_steps: 10
  use_cache: true
  freeze_vision_encoder: true
  train_expert_only: true
  train_state_proj: true
  optimizer_lr: 0.0001
  optimizer_betas:
  - 0.9
  - 0.95
  optimizer_eps: 1.0e-08
  optimizer_weight_decay: 1.0e-10
  optimizer_grad_clip_norm: 10
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 30000
  scheduler_decay_lr: 2.5e-06
  vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  load_vlm_weights: false
  attention_mode: cross_attn
  prefix_length: -1
  pad_language_to: longest
  num_expert_layers: -1
  num_vlm_layers: 16
  self_attn_every_n_layers: 2
  expert_width_multiplier: 0.75
  min_period: 0.004
  max_period: 4.0
  compile_model: false
  compile_mode: max-autotune
eval:
  train_output_root: outputs/train/robocasa/composite/ArrangeBreadBasket/smolvla
  output_dir: outputs/eval/robocasa/composite/ArrangeBreadBasket/smolvla/{run_tag}
  task: ArrangeBreadBasket
  eval_split: test
  test_ratio: 0.2
  split_seed: 42
  split_shuffle: true
  max_episodes: 20
  max_steps_per_episode: null
  seed: 42
  device: cuda
  n_action_steps: 50
  robocasa_conda_env: robocasa
  robocasa_split: target
  num_rollouts: 20
  max_steps: null
  fps: 20
  max_episodes_rendered: 4
