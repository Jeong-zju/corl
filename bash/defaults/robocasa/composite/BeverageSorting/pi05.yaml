# pi05 defaults for robocasa/composite/BeverageSorting.
train:
  dataset_root: data/robocasa/composite/BeverageSorting
  dataset_repo_id: robocasa/composite/BeverageSorting
  output_root: outputs/train/robocasa/composite/BeverageSorting/pi05
  resume: false
  job_name: pi05
  wandb_project: robocasa-composite-beveragesorting
  wandb_mode: online
  device: cuda
  use_amp: true
  amp_dtype: auto
  distributed:
    enabled: false
    launcher: accelerate
    num_processes: 1
    gpu_ids: all
    num_machines: 1
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
  steps: 50000
  batch_size: 8
  num_workers: 16
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  video_backend: torchcodec
  torch_sharing_strategy: file_system
  torchcodec_decoder_cache_size: 32
  seed: 42
  log_freq: 2000
  save_freq: 10000
  eval_freq: -1
  test_ratio: 0.2
  split_seed: 42
  split_shuffle: true
  chunk_size: 50
  n_action_steps: 50
  enable_wandb: true
  wandb_console: 'off'
  wandb_service_wait: 10
  policy_path: lerobot/pi05_base
  n_obs_steps: 1
  max_state_dim: 32
  max_action_dim: 32
  empty_cameras: 0
  tokenizer_max_length: 200
  freeze_vision_encoder: true
  train_expert_only: true
  optimizer_lr: 2.5e-05
  optimizer_betas:
  - 0.9
  - 0.95
  optimizer_eps: 1.0e-08
  optimizer_weight_decay: 0.01
  optimizer_grad_clip_norm: 1.0
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 30000
  scheduler_decay_lr: 2.5e-06
  min_period: 0.004
  max_period: 4.0
  compile_model: false
  compile_mode: max-autotune
  image_resolution:
  - 224
  - 224
  num_inference_steps: 10
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: float32
  ignore_signature: true
  gradient_checkpointing: false
  time_sampling_beta_alpha: 1.5
  time_sampling_beta_beta: 1.0
  time_sampling_scale: 0.999
  time_sampling_offset: 0.001
eval:
  train_output_root: outputs/train/robocasa/composite/BeverageSorting/pi05
  output_dir: outputs/eval/robocasa/composite/BeverageSorting/pi05/{run_tag}
  task: BeverageSorting
  eval_split: test
  test_ratio: 0.2
  split_seed: 42
  split_shuffle: true
  max_episodes: 20
  max_steps_per_episode: null
  seed: 42
  device: cuda
  n_action_steps: 50
  robocasa_conda_env: robocasa
  robocasa_split: target
  num_rollouts: 20
  max_steps: null
  fps: 20
  max_episodes_rendered: 4
