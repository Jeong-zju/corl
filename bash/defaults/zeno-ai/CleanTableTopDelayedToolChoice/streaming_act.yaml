# Single-task Streaming ACT defaults for zeno-ai/CleanTableTopDelayedToolChoice.
train:
  dataset_root: "data/zeno-ai/CleanTableTopDelayedToolChoice"
  dataset_repo_id: "zeno-ai/CleanTableTopDelayedToolChoice"
  output_root: "outputs/train/zeno-ai/CleanTableTopDelayedToolChoice/streaming-act-prism"
  resume: false
  job_name: "streaming-act-prism"
  wandb_project: "CleanTableTopDelayedToolChoice"
  wandb_mode: "online"
  device: "cuda"
  use_amp: true
  amp_dtype: "auto"
  distributed:
    enabled: false
    launcher: "accelerate"
    num_processes: 1
    gpu_ids: "all"
    num_machines: 1
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
  # Dataset summary: 100 episodes, 290,998 frames at 30 FPS
  # (~2,910 frames / ~97s per episode), 3 synchronized 224px cameras,
  # and 5,219-dim full-prefix path/delta signatures. Keep full-data
  # training because the dataset is small in episode count, but trim per-step
  # batch size for the longer visual-prefix memory budget below.
  steps: 240000
  batch_size: 12
  num_workers: 8
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 3
  video_backend: "torchcodec"
  torch_sharing_strategy: "file_system"
  torchcodec_decoder_cache_size: 32
  seed: 42
  log_freq: 1000
  save_freq: 20000
  eval_freq: -1
  test_ratio: 0
  split_seed: 42
  split_shuffle: true
  chunk_size: 100
  n_action_steps: 100
  enable_wandb: true
  wandb_console: "off"
  wandb_service_wait: 10
  use_path_signature: true
  use_delta_signature: true
  use_prefix_sequence_training: true
  # Long delayed-tool episodes need both an early condition anchor and enough
  # recent visual evidence for the final tool/target choice. Prefix selection
  # keeps the first frame and the latest tail; 24 x stride 8 spans about the
  # last 6s at 30 FPS without making 3-camera prefix decoding excessive.
  prefix_train_max_steps: 24
  prefix_frame_stride: 8
  prefix_pad_value: 0.0
  use_visual_prefix_memory: true
  use_signature_conditioned_visual_prefix_memory: false
  use_signature_indexed_slot_memory: true
  use_memory_conditioned_encoder_film: true
  num_memory_slots: 1
  # Six SISM slots give the policy room to separate early tool cue, chosen tool,
  # target/cleanup state, and residual phase context while staying compact.
  slot_memory_num_slots: 6
  slot_memory_routing_hidden_dim: 512
  slot_memory_identity_scale: 0.5
  slot_memory_routing_temperature: 0.5
  slot_memory_use_delta_routing: true
  slot_memory_use_softmax_routing: true
  slot_memory_use_readout_pooling: true
  # Entropy sharpens each step's route; balance prevents all prefixes from
  # collapsing into one slot, giving an unsupervised clustered routing rule.
  slot_memory_balance_loss_coef: 0.25
  slot_memory_entropy_loss_coef: 0.03
  slot_memory_consistency_loss_coef: 0.005
  history_length: 0
  signature_dim: 0
  signature_depth: 3
  signature_hidden_dim: 512
  signature_dropout: 0.1
  signature_cache_mode: "ram"
  signature_cache_dtype: "float16"
  prefix_image_cache_mode: "off"
  prefix_image_cache_dtype: "uint8"

eval:
  train_output_root: "outputs/train/zeno-ai/CleanTableTopDelayedToolChoice/streaming-act-prism"
  output_dir: "outputs/eval/zeno-ai/CleanTableTopDelayedToolChoice/streaming-act-prism/{run_tag}"
  eval_split: "test"
  test_ratio: 0.2
  split_seed: 42
  split_shuffle: true
  max_episodes: 20
  max_steps_per_episode: null
  seed: 42
  device: "cuda"
  n_action_steps: 1
  temporal_ensemble_coeff: 0.0075
  signature_backend: "signatory"
