# Single-task PRISM Diffusion defaults for zeno-ai/BookOriginRelocation.
train:
  dataset_root: "data/zeno-ai/BookOriginRelocation"
  dataset_repo_id: "zeno-ai/BookOriginRelocation"
  output_root: "outputs/train/zeno-ai/BookOriginRelocation/prism-diffusion"
  resume: false
  job_name: "prism-diffusion"
  wandb_project: "BookOriginRelocation"
  wandb_mode: "online"
  device: "cuda"
  use_amp: true
  amp_dtype: "auto"
  distributed:
    enabled: false
    launcher: "accelerate"
    num_processes: 1
    gpu_ids: "all"
    num_machines: 1
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
  # Match the memory settings used by Streaming ACT while lowering the
  # per-device batch size for diffusion plus 3-camera prefix decoding.
  steps: 200000
  batch_size: 4
  num_workers: 8
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 3
  video_backend: "torchcodec"
  torch_sharing_strategy: "file_system"
  torchcodec_decoder_cache_size: 32
  enable_filtered_hf_cache: true
  seed: 42
  log_freq: 1000
  save_freq: 25000
  eval_freq: -1
  test_ratio: 0
  split_seed: 42
  split_shuffle: true
  n_obs_steps: 2
  horizon: 104
  n_action_steps: 100
  drop_n_last_frames: 3
  enable_wandb: true
  wandb_console: "off"
  wandb_service_wait: 10
  use_path_signature: true
  use_delta_signature: true
  history_length: 0
  signature_dim: 0
  signature_depth: 3
  signature_hidden_dim: 512
  signature_dropout: 0.1
  use_prefix_sequence_training: true
  prefix_train_max_steps: 24
  prefix_frame_stride: 6
  prefix_pad_value: 0.0
  signature_cache_mode: "ram"
  signature_cache_dtype: "float16"
  prefix_image_cache_mode: "off"
  prefix_image_cache_dtype: "uint8"
  use_visual_prefix_memory: true
  use_signature_indexed_slot_memory: true
  slot_memory_num_slots: 4
  slot_memory_routing_hidden_dim: 512
  slot_memory_use_delta_routing: true
  slot_memory_use_softmax_routing: true
  slot_memory_use_readout_pooling: true
  slot_memory_balance_loss_coef: 0.1
  slot_memory_consistency_loss_coef: 0.005
  prism_adapter_hidden_dim: 512
  prism_adapter_zero_init: true

eval:
  train_output_root: "outputs/train/zeno-ai/BookOriginRelocation/prism-diffusion"
  output_dir: "outputs/eval/zeno-ai/BookOriginRelocation/prism-diffusion/{run_tag}"
  eval_split: "test"
  test_ratio: 0.2
  split_seed: 42
  split_shuffle: true
  max_episodes: 20
  max_steps_per_episode: null
  seed: 42
  device: "cuda"
  n_action_steps: 50
