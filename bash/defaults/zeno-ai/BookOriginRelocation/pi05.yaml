# Pi0.5 defaults for zeno-ai/BookOriginRelocation.
train:
  dataset_root: "data/zeno-ai/BookOriginRelocation"
  dataset_repo_id: "zeno-ai/BookOriginRelocation"
  output_root: "outputs/train/zeno-ai/BookOriginRelocation/pi05"
  resume: false
  job_name: "pi05"
  wandb_project: "BookOriginRelocation"
  wandb_mode: "online"
  device: "cuda"
  use_amp: true
  amp_dtype: "bf16"
  distributed:
    enabled: false
    launcher: "accelerate"
    num_processes: 1
    gpu_ids: "all"
    num_machines: 1
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
  # Pi0.5 is substantially heavier than ACT/SmolVLA. These defaults keep the
  # official LeRobot PI05 pipeline on a single RTX 5090 by using bf16, gradient
  # checkpointing, and expert-only fine-tuning with a small per-device batch.
  steps: 180000
  batch_size: 1
  num_workers: 8
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 2
  video_backend: "torchcodec"
  torch_sharing_strategy: "file_system"
  torchcodec_decoder_cache_size: 16
  seed: 42
  log_freq: 200
  save_freq: 20000
  eval_freq: -1
  test_ratio: 0
  split_seed: 42
  split_shuffle: true
  chunk_size: 50
  n_action_steps: 50
  enable_wandb: true
  wandb_console: "off"
  wandb_service_wait: 10

  policy_path: "lerobot/pi05_base"
  n_obs_steps: 1
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  dtype: "bfloat16"
  max_state_dim: 32
  max_action_dim: 32
  image_resolution:
    - 224
    - 224
  empty_cameras: 0
  tokenizer_max_length: 200
  num_inference_steps: 10
  time_sampling_beta_alpha: 1.5
  time_sampling_beta_beta: 1.0
  time_sampling_scale: 0.999
  time_sampling_offset: 0.001
  min_period: 0.004
  max_period: 4.0
  # Pi0.5 defaults to quantile normalization, but BookOriginRelocation has
  # several near-constant action dimensions whose q01/q99 span is effectively
  # zero. Mean/std keeps those dimensions bounded and avoids 1e12-scale losses.
  normalization_mapping:
    VISUAL: "IDENTITY"
    STATE: "MEAN_STD"
    ACTION: "MEAN_STD"
  gradient_checkpointing: true
  compile_model: false
  compile_mode: "max-autotune"
  freeze_vision_encoder: false
  train_expert_only: true
  optimizer_lr: 0.000025
  optimizer_betas:
    - 0.9
    - 0.95
  optimizer_eps: 1.0e-08
  optimizer_weight_decay: 0.01
  optimizer_grad_clip_norm: 1.0
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 30000
  scheduler_decay_lr: 0.0000025

eval:
  train_output_root: "outputs/train/zeno-ai/BookOriginRelocation/pi05"
  output_dir: "outputs/eval/zeno-ai/BookOriginRelocation/pi05/{run_tag}"
  eval_split: "test"
  test_ratio: 0.2
  split_seed: 42
  split_shuffle: true
  max_episodes: 20
  max_steps_per_episode: null
  seed: 42
  device: "cuda"
  n_action_steps: 50
