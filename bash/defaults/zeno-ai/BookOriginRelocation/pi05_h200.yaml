# pi05 defaults for zeno-ai/BookOriginRelocation on H200.
# Thin override over the base pi05 preset.
train:
  dataset_root: data/zeno-ai/BookOriginRelocation
  dataset_repo_id: zeno-ai/BookOriginRelocation
  output_root: outputs/train/zeno-ai/BookOriginRelocation/pi05-h200
  resume: false
  job_name: pi05-h200
  wandb_project: BookOriginRelocation
  wandb_mode: offline
  device: cuda
  use_amp: true
  amp_dtype: bf16
  distributed:
    enabled: false
    launcher: accelerate
    num_processes: 1
    gpu_ids: all
    num_machines: 1
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
  steps: 180000
  # H200 has enough VRAM to run a larger single-device batch.
  batch_size: 16
  num_workers: 16
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  video_backend: torchcodec
  torch_sharing_strategy: file_system
  torchcodec_decoder_cache_size: 32
  seed: 42
  log_freq: 1000
  save_freq: 30000
  eval_freq: -1
  test_ratio: 0
  split_seed: 42
  split_shuffle: true
  chunk_size: 50
  n_action_steps: 50
  enable_wandb: true
  wandb_console: 'off'
  wandb_service_wait: 10
  dtype: bfloat16
eval:
  train_output_root: outputs/train/zeno-ai/BookOriginRelocation/pi05-h200
  output_dir: outputs/eval/zeno-ai/BookOriginRelocation/pi05-h200/{run_tag}
  eval_split: test
  test_ratio: 0.2
  split_seed: 42
  split_shuffle: true
  max_episodes: 20
  max_steps_per_episode: null
  seed: 42
  device: cuda
  n_action_steps: 50
