# pi05 defaults for zeno-ai/braidedhub_fourstart_implicit_cue_v30.
train:
  dataset_root: data/zeno-ai/braidedhub_fourstart_implicit_cue_v30
  dataset_repo_id: zeno-ai/braidedhub_fourstart_implicit_cue_v30
  output_root: outputs/train/braidedhub/pi05
  resume: false
  job_name: pi05
  wandb_project: braidedhub
  wandb_mode: online
  device: cuda
  distributed:
    enabled: false
    launcher: accelerate
    num_processes: 1
    gpu_ids: all
    num_machines: 1
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
  steps: 50000
  batch_size: 8
  num_workers: 4
  seed: 42
  log_freq: 50
  save_freq: 10000
  eval_freq: -1
  chunk_size: 50
  n_action_steps: 50
  enable_wandb: true
  wandb_console: 'off'
  wandb_service_wait: 10
  policy_path: lerobot/pi05_base
  n_obs_steps: 1
  use_amp: true
  amp_dtype: auto
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  torch_sharing_strategy: file_system
  video_backend: torchcodec
  max_state_dim: 32
  max_action_dim: 32
  empty_cameras: 0
  tokenizer_max_length: 200
  freeze_vision_encoder: true
  train_expert_only: true
  optimizer_lr: 2.5e-05
  optimizer_betas:
  - 0.9
  - 0.95
  optimizer_eps: 1.0e-08
  optimizer_weight_decay: 0.01
  optimizer_grad_clip_norm: 1.0
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 30000
  scheduler_decay_lr: 2.5e-06
  min_period: 0.004
  max_period: 4.0
  compile_model: false
  compile_mode: max-autotune
  image_resolution:
  - 224
  - 224
  num_inference_steps: 10
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: float32
  ignore_signature: true
  gradient_checkpointing: false
  time_sampling_beta_alpha: 1.5
  time_sampling_beta_beta: 1.0
  time_sampling_scale: 0.999
  time_sampling_offset: 0.001
eval:
  train_output_root: outputs/train/braidedhub/pi05
  output_dir: outputs/eval/braidedhub/pi05/{run_tag}
  num_rollouts: 50
  max_steps: 240
  fps: 20
  seed: 42
  device: cuda
  n_action_steps: 50
  max_action_step: 2.5
  collision_mode: detect
  enable_randomize: true
