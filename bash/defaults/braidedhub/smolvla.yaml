# SmolVLA defaults for braidedhub.
train:
  dataset_root: data/zeno-ai/braidedhub_fourstart_implicit_cue_v30
  dataset_repo_id: zeno-ai/braidedhub_fourstart_implicit_cue_v30
  output_root: outputs/train/braidedhub/smolvla
  resume: false
  job_name: smolvla
  wandb_project: braidedhub
  wandb_mode: online
  device: cuda
  distributed:
    enabled: false
    launcher: accelerate
    num_processes: 1
    gpu_ids: all
    num_machines: 1
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
  steps: 50000
  batch_size: 8
  num_workers: 4
  seed: 42
  log_freq: 50
  save_freq: 10000
  eval_freq: -1
  chunk_size: 50
  n_action_steps: 50
  enable_wandb: true
  wandb_console: 'off'
  wandb_service_wait: 10
  policy_path: lerobot/smolvla_base
  n_obs_steps: 1
  use_amp: true
  amp_dtype: auto
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  torch_sharing_strategy: file_system
  video_backend: torchcodec
  max_state_dim: 32
  max_action_dim: 32
  resize_imgs_with_padding:
  - 512
  - 512
  empty_cameras: 0
  tokenizer_max_length: 48
  num_steps: 10
  use_cache: true
  freeze_vision_encoder: true
  train_expert_only: true
  train_state_proj: true
  optimizer_lr: 0.0001
  optimizer_betas:
  - 0.9
  - 0.95
  optimizer_eps: 1.0e-08
  optimizer_weight_decay: 1.0e-10
  optimizer_grad_clip_norm: 10
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 30000
  scheduler_decay_lr: 2.5e-06
  vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  load_vlm_weights: false
  attention_mode: cross_attn
  prefix_length: -1
  pad_language_to: longest
  num_expert_layers: -1
  num_vlm_layers: 16
  self_attn_every_n_layers: 2
  expert_width_multiplier: 0.75
  min_period: 0.004
  max_period: 4.0
  compile_model: false
  compile_mode: max-autotune
eval:
  train_output_root: outputs/train/braidedhub/smolvla
  output_dir: outputs/eval/braidedhub/smolvla/{run_tag}
  num_rollouts: 50
  max_steps: 240
  fps: 20
  seed: 42
  device: cuda
  n_action_steps: 50
  max_action_step: 2.5
  collision_mode: detect
  enable_randomize: true
