# GR00T N1.5 defaults for panda_route.
train:
  dataset_root: data/zeno-ai/panda_route_onebit_cue_v30
  dataset_repo_id: zeno-ai/panda_route_onebit_cue_v30
  output_root: outputs/train/panda_route/groot
  resume: false
  job_name: groot
  wandb_project: panda_route
  wandb_mode: online
  device: cuda
  distributed:
    enabled: false
    launcher: accelerate
    num_processes: 1
    gpu_ids: all
    num_machines: 1
    machine_rank: 0
    main_process_ip: null
    main_process_port: null
  steps: 50000
  batch_size: 8
  num_workers: 4
  seed: 42
  log_freq: 50
  save_freq: 10000
  eval_freq: -1
  chunk_size: 50
  n_action_steps: 5
  enable_wandb: true
  wandb_console: 'off'
  wandb_service_wait: 10
  policy_path: null
  n_obs_steps: 1
  use_amp: true
  amp_dtype: auto
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  torch_sharing_strategy: file_system
  video_backend: torchcodec
  max_state_dim: 64
  max_action_dim: 32
  optimizer_lr: 0.0001
  optimizer_betas:
  - 0.95
  - 0.999
  optimizer_eps: 1.0e-08
  optimizer_weight_decay: 1.0e-05
  optimizer_grad_clip_norm: 10
  scheduler_decay_lr: 1.0e-05
  ignore_signature: true
  image_size:
  - 224
  - 224
  base_model_path: nvidia/GR00T-N1.5-3B
  tokenizer_assets_repo: lerobot/eagle2hg-processor-groot-n1p5
  embodiment_tag: new_embodiment
  tune_llm: false
  tune_visual: false
  tune_projector: true
  tune_diffusion_model: true
  lora_rank: 0
  lora_alpha: 16
  lora_dropout: 0.1
  lora_full_model: false
  warmup_ratio: 0.05
  use_bf16: true
  groot_video_backend: decord
  balance_dataset_weights: true
  balance_trajectory_weights: true
  attn_implementation: eager
eval:
  train_output_root: outputs/train/panda_route/groot
  output_dir: outputs/eval/panda_route/groot/{run_tag}
  num_rollouts: 50
  max_steps: 500
  fps: 20
  seed: 42
  device: cuda
  n_action_steps: 5
  max_action_step: 0.02
  enable_randomize: false
